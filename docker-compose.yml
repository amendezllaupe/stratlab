services:
  postgres:
    image: postgres:16-alpine
    container_name: stratlab-postgres
    environment:
      POSTGRES_DB: stratlab
      POSTGRES_USER: stratlab
      POSTGRES_PASSWORD: stratlab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratlab -d stratlab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
