name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Spring Boot backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stratlab
          POSTGRES_USER: stratlab
          POSTGRES_PASSWORD: stratlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stratlab -d stratlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/stratlab
      SPRING_DATASOURCE_USERNAME: stratlab
      SPRING_DATASOURCE_PASSWORD: stratlab
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: sh ./mvnw test
